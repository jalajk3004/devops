apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-frontend
  namespace: invoice-triage
spec:
  replicas: 2
  selector:
    matchLabels: { app: invoice-frontend }
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels: { app: invoice-frontend }
    spec:
      containers:
        - name: frontend
          image: jalajkumarr/invoice-triage-frontend:21
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-frontend
  namespace: invoice-triage
spec:
  selector: { app: invoice-frontend }
  ports:
    - port: 3001
      targetPort: 3001